spring.application.name=pulsepass

# JWT configuration. The secret must be supplied as Base64-encoded random key material.
pulsepass.security.jwt.issuer=${PULSEPASS_JWT_ISSUER:pulsepass-api}
pulsepass.security.jwt.secret-base64=${PULSEPASS_JWT_SECRET_BASE64:}
pulsepass.security.jwt.access-token-ttl-seconds=${PULSEPASS_JWT_ACCESS_TOKEN_TTL_SECONDS:900}
pulsepass.security.cors.allowed-origins=${PULSEPASS_CORS_ALLOWED_ORIGINS:}
pulsepass.security.require-https=${PULSEPASS_REQUIRE_HTTPS:true}

# PostgreSQL datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pulsepass}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
