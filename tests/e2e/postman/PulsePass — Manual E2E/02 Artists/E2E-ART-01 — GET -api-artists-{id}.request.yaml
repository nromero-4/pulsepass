$kind: http-request
name: E2E-ART-01 — GET /api/artists/{id}
description: |-
  **Objetivo:** Consultar artista por ID.

  **Precondiciones:** {{artistId}} debe existir.

  **HTTP Esperado:** 200

  **Revisión Manual:**
  - Status: 200
  - Body: ArtistResponse con id, stageName, country, genre, active
  - Sin campos sensibles

  **Caso Negativo:** ID inexistente → 404
url: "{{baseUrl}}/api/artists/{{artistId}}"
method: GET
headers:
  Accept: application/json
order: 1000
