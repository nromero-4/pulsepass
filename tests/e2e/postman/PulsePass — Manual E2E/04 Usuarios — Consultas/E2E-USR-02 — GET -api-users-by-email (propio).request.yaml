$kind: http-request
name: E2E-USR-02 — GET /api/users/by-email (propio)
description: |-
  **Objetivo:** USER_A consulta su propio email.

  **Precondiciones:** USER_A autenticado con token válido.

  **HTTP Esperado:** 200

  **Revisión Manual:**
  - Status: 200
  - Body: UserResponse con datos de USER_A
url: "{{baseUrl}}/api/users/by-email?email={{userAEmail}}"
method: GET
headers:
  Authorization: Bearer {{userAToken}}
  Accept: application/json
queryParams:
  email: "{{userAEmail}}"
order: 1000
