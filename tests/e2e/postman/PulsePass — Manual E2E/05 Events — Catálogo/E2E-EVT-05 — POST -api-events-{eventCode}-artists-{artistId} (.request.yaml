$kind: http-request
name: E2E-EVT-05 — POST /api/events/{eventCode}/artists/{artistId} (asociar artista)
description: |-
  **Objetivo:** ADMIN asocia artista a evento DRAFT.

  **Precondiciones:** {{artistId}} existe, evento en DRAFT o PUBLISHED, no duplicado.

  **HTTP Esperado:** 200

  **Revisión Manual:**
  - Status: 200
  - Body: EventResponse con artists conteniendo el artista asociado
url: "{{baseUrl}}/api/events/{{draftEventCode}}/artists/{{artistId}}"
method: POST
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
order: 9000
