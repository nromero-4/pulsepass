$kind: http-request
name: E2E-EVT-02 — GET /api/events/{eventCode} (borrador por ADMIN)
description: |-
  **Objetivo:** ADMIN puede leer evento DRAFT.

  **Precondiciones:** {{draftEventCode}} en estado DRAFT.

  **HTTP Esperado:** 200

  **Revisión Manual:**
  - Status: 200
  - Body: EventResponse con status=DRAFT
url: "{{baseUrl}}/api/events/{{draftEventCode}}"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
  Accept: application/json
order: 4000
