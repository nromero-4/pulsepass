  **Objetivo:** Propietario consulta ticket por código.

  **Precondiciones:** {{ticketCancelableCode}} comprado por USER_A.

  **HTTP Esperado:** 200

  **Revisión Manual:**
  - Status: 200
  - Body: TicketResponse con status=PAID, userEmail=USER_A
